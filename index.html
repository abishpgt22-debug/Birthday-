<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Rashmika ♥</title>
<meta name="theme-color" content="#ffd6e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ffb6d0; --baby:#ffd9e8; --lav:#d9c8f5; --cream:#fff6ec; --peach:#ffd3b8; --white:#fff;
  --rose:#e0568f; --ink:#6a3550; --ink-soft:#8d5a74;
  --glass:rgba(255,255,255,.62); --shadow:0 10px 30px rgba(224,86,143,.18);
  --script:"Dancing Script","Segoe Script","Brush Script MT",cursive;
  --body:"Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);font-size:1.05rem;line-height:1.7;overflow-x:hidden;min-height:100vh;
  background:linear-gradient(160deg,var(--cream) 0%,var(--baby) 38%,var(--lav) 78%,var(--peach) 100%);background-attachment:fixed}
body.locked{overflow:hidden;height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2{font-family:var(--script);font-weight:700;line-height:1.15;color:var(--rose)}
h1{font-size:clamp(2.6rem,11vw,4.6rem)} h2{font-size:clamp(2rem,8vw,3rem);margin-bottom:.5rem}
section{position:relative;min-height:100svh;padding:4.5rem 1.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lead{max-width:30rem;color:var(--ink-soft);margin:.4rem auto 1.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:52px;padding:.8rem 1.8rem;border-radius:999px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#f77fb0,#e0568f);box-shadow:0 8px 22px rgba(224,86,143,.4);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px) scale(1.03)} .btn:active{transform:scale(.97)}
.btn.soft{background:var(--glass);color:var(--rose);box-shadow:var(--shadow);border:2px solid #fff}
.card{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.85);border-radius:28px;box-shadow:var(--shadow)}

/* floating background */
#float{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#float span{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;color:var(--pink)}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.7}90%{opacity:.5}100%{transform:translateY(-112vh) rotate(40deg);opacity:0}}
.cloud{position:absolute;background:#fff;border-radius:99px;opacity:.7;animation:drift 18s ease-in-out infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:12%;top:-80%} .cloud::after{width:40%;height:120%;right:14%;top:-50%}
@keyframes drift{to{transform:translateX(40px)}}
main,#welcome{position:relative;z-index:1}
main{display:none} main.show{display:block}

/* welcome */
#welcome{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.2rem;transition:opacity .8s,transform .8s}
#welcome.gone{opacity:0;transform:scale(1.08);pointer-events:none}
.gift{position:relative;width:150px;height:150px;margin:1.4rem auto 1.8rem;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.gift .box{position:absolute;bottom:0;left:10px;right:10px;height:95px;border-radius:10px;background:linear-gradient(#ffa3c6,#f77fb0)}
.gift .box::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:#fff6ec}
.gift .lid{position:absolute;left:0;right:0;bottom:90px;height:42px;border-radius:12px;background:linear-gradient(#ffc2da,#ff9ec4);transition:transform .9s cubic-bezier(.3,1.6,.5,1);transform-origin:left bottom}
.gift .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:#fff6ec}
.gift .bow{position:absolute;left:50%;top:-26px;width:60px;height:34px;margin-left:-30px;
  background:radial-gradient(circle at 20% 50%,#fff6ec 0 14px,transparent 15px),radial-gradient(circle at 80% 50%,#fff6ec 0 14px,transparent 15px)}
.gift .bow::after{content:"♥";position:absolute;left:50%;top:4px;transform:translateX(-50%);color:var(--rose);font-size:1.3rem}
.gift.open{animation:none}.gift.open .lid{transform:translate(-30px,-70px) rotate(-35deg)}
.gift .glow{position:absolute;left:50%;top:40%;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 #fff;opacity:0}
.gift.open .glow{animation:glow 1s ease-out}
@keyframes glow{0%{opacity:1;box-shadow:0 0 0 0 #fff}100%{opacity:0;box-shadow:0 0 0 160px #fff}}

/* music */
#music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;display:none;align-items:center;gap:.5rem;min-height:52px;padding:.5rem 1rem;border-radius:999px;font-weight:700;color:var(--rose)}
#music.show{display:flex}
.bars{display:flex;gap:2px;align-items:flex-end;height:16px}
.bars i{width:3px;background:var(--rose);border-radius:2px;height:4px}
#music.playing .bars i{animation:eq .8s ease-in-out infinite alternate}
#music.playing .bars i:nth-child(2){animation-delay:.2s}#music.playing .bars i:nth-child(3){animation-delay:.4s}
@keyframes eq{to{height:16px}}
#musicNote{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;font-size:.85rem;padding:.4rem .8rem;border-radius:14px;background:#fff;color:var(--ink-soft);box-shadow:var(--shadow);display:none;max-width:240px}

/* birthday */
.cake-mini{width:min(240px,60vw);margin:.5rem auto 1rem;animation:bob 4s ease-in-out infinite}
.balloon{position:absolute;width:54px;height:66px;border-radius:50% 50% 46% 46%;animation:sway 5s ease-in-out infinite alternate;opacity:.9}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:70px;background:#c9a7bd}
@keyframes sway{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-18px) rotate(6deg)}}
#wishMsg{min-height:3.4rem;margin-top:1.1rem;font-family:var(--script);font-size:1.7rem;color:var(--rose);max-width:26rem;line-height:1.3}
.date{color:var(--ink-soft);font-weight:600;margin-bottom:.4rem}

/* message + letter */
.paper{width:min(100%,36rem);padding:2rem 1.5rem;text-align:left;margin:1.2rem 0}
.paper .txt{white-space:pre-wrap;min-height:6rem;font-size:1.08rem}
.paper .txt.cursor::after{content:"▍";color:var(--rose);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* cake */
.cake-wrap{position:relative;width:min(340px,92vw);margin:1rem auto 0}
.cake-wrap svg.cake{display:block;width:100%;height:auto;overflow:visible}
.candle{position:absolute;bottom:62%;width:48px;height:92px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;z-index:3}
.candle .stick{width:12px;height:46px;border-radius:5px;background:repeating-linear-gradient(135deg,#fff 0 5px,var(--c) 5px 10px)}
.candle .flame{position:relative;width:16px;height:26px;margin-bottom:2px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(#fff 15%,#ffd36b 55%,#ff9a4d);
  box-shadow:0 0 18px 6px rgba(255,200,90,.7);animation:flick .35s ease-in-out infinite alternate;transform-origin:bottom}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.92,1.1) rotate(4deg)}}
.candle.out .flame{display:none}
.candle .smoke{position:absolute;bottom:50px;width:10px;height:10px;border-radius:50%;background:rgba(150,130,150,.5);opacity:0}
.candle.out .smoke{animation:smoke 1.8s ease-out}
@keyframes smoke{0%{opacity:.8;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-60px) scale(2.6)}}
#cakeMsg{font-family:var(--script);font-size:1.8rem;color:var(--rose);min-height:3.4rem;margin:1rem 0 .6rem;max-width:26rem;line-height:1.25}
.spark{position:absolute;color:#ffb347;animation:tw 2.4s ease-in-out infinite;font-size:1.1rem}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}

/* reasons */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.1rem;width:min(100%,60rem);margin-top:1.5rem}
.reason{padding:1.5rem 1.2rem;opacity:0;transform:translateY(34px) scale(.96);transition:opacity .8s,transform .8s}
.reason.in{opacity:1;transform:none}
.reason svg{width:64px;height:64px;margin-bottom:.5rem}
.reason p{font-weight:600}
@media(hover:hover){.reason.in:hover{transform:translateY(-6px) rotate(-1deg)}}
.reason.pop{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.06) rotate(2deg)}}

/* envelope */
.env{position:relative;width:min(270px,76vw);height:min(176px,50vw);margin:1.4rem auto;transition:transform .8s,opacity .8s}
.env .back{position:absolute;inset:0;border-radius:10px;background:linear-gradient(#ffc9a8,#ffb48f);box-shadow:var(--shadow)}
.env .front{position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,#ffe0cc,#ffcbb0);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:2}
.env .flap{position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(#ffd9c2,#ffbfa0);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:4}
.env .seal{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8fb8,#d6407f);color:#fff;display:grid;place-items:center;z-index:5;box-shadow:0 4px 10px rgba(0,0,0,.2);transition:opacity .4s;animation:pulse 1.8s infinite}
.env.open .flap{transform:rotateX(180deg);z-index:1}.env.open .seal{opacity:0}
.env.gone{transform:scale(.5) translateY(30px);opacity:0;height:0;margin:0;pointer-events:none}
#letterBox{display:none;width:100%;flex-direction:column;align-items:center}#letterBox.show{display:flex;animation:fade 1s}
@keyframes fade{from{opacity:0;transform:translateY(24px)}}
.sign{margin-top:1.5rem;font-family:var(--script);font-size:1.9rem;color:var(--rose)}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.sparkle{position:fixed;pointer-events:none;z-index:70;animation:burst 1.1s ease-out forwards;color:#ffb347}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.3) rotate(120deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important;scroll-behavior:auto!important}
  #float{display:none}.reason{opacity:1;transform:none}}
</style>
</head>
<body class="locked">
<div id="float" aria-hidden="true">
  <div class="cloud" style="width:120px;height:34px;top:9%;left:6%"></div>
  <div class="cloud" style="width:90px;height:26px;top:28%;right:4%;animation-delay:-6s"></div>
  <div class="cloud" style="width:140px;height:38px;top:62%;left:-2%;animation-delay:-3s"></div>
</div>

<!-- 1. WELCOME -->
<header id="welcome">
  <h1 id="wTitle">Hey, My Chellam ♥️</h1>
  <p class="lead" id="wSub">Someone has created a little world just for you…</p>

<main id="main">
  <!-- 2. CELEBRATION -->
  <section id="celebrate">

      <circle cx="100" cy="30" r="10" fill="#ff5a8a"/><path d="M100 22l-3-6m3 6l4-6" stroke="#6bb36b" stroke-width="3" stroke-linecap="round"/>

  <!-- 3. MESSAGE -->
  <section id="message">

    <article class="card paper" aria-label="Birthday message">
      <p class="txt" id="msgText" aria-live="off"></p>
    </article>
    <button class="btn" id="readBtn" type="button">Read My Heart 💌</button>
  </section>

  <!-- 4. CAKE -->
  <section id="cake">
    <h2>A Little Cake for My Chellam 🎂</h2>
    <p class="lead" id="cakeInstr"></p>
    <div class="cake-wrap" id="cakeWrap">
      <svg class="cake" viewBox="0 0 340 290" aria-hidden="true">
        <ellipse cx="170" cy="272" rx="150" ry="14" fill="#e9c6d8"/>
        <rect x="20" y="190" width="300" height="80" rx="22" fill="#ff9ec4"/>
        <rect x="60" y="120" width="220" height="76" rx="20" fill="#ffb6d0"/>
        <rect x="100" y="62" width="140" height="64" rx="18" fill="#ffd0e2"/>
        <path d="M20 205q18 24 36 0t36 0 36 0 36 0 36 0 36 0 36 0 28 14v-34H20z" fill="#fff6ec"/>
        <path d="M60 135q16 20 32 0t32 0 32 0 32 0 32 0 20 12v-26H60z" fill="#fff6ec"/>
        <path d="M100 76q12 16 24 0t24 0 24 0 24 0 20 10V62H100z" fill="#fff6ec"/>
        <g fill="#ff4f7e"><path d="M44 236c-9-8-3-18 6-14 9-4 15 6 6 14l-6 6z"/><path d="M164 236c-9-8-3-18 6-14 9-4 15 6 6 14l-6 6z"/><path d="M284 236c-9-8-3-18 6-14 9-4 15 6 6 14l-6 6z"/></g>
        <g fill="#6bb36b"><circle cx="50" cy="224" r="2.5"/><circle cx="170" cy="224" r="2.5"/><circle cx="290" cy="224" r="2.5"/></g>

<script>
/* ==========================================================
   EDIT HERE — everything personal lives in this one object.
   ========================================================== */
const CONFIG = {
  name: "Rashmika",
  nickname: "Chellam",
  birthdayDate: "",                // optional, e.g. "2 September" — leave "" to hide
  musicPath: "romantic-music.mp3", // put an audio file you have permission to use next to index.html
  welcomeTitle: "Hey, My Chellam ♥️",
  welcomeSub: "Someone has created a little world just for you…",
  openButton: "Open Your Little Surprise 🎁",
  birthdayTitle: "Happy Birthday, Rashmika! 🎂💕",
  birthdayNick: "My dearest Chellam ♥️",
  birthdaySub: "Today is all about the beautiful soul who makes my world brighter.",
  wishText: "May every wish in your heart find its way to you, Chellam. ✨💗",
  message:
`Happy Birthday, my dearest Rashmika, my Chellam ♥️

Today is a beautiful reminder of how special you are. You bring so much warmth, happiness, and sweetness into my world just by being you.

If I could give you one gift today, it would be the ability to see yourself through my eyes, so you could understand just how precious and wonderful you are to me.

I wish your life is filled with beautiful smiles, peaceful days, endless happiness, dreams coming true, and all the love your heart deserves.

No matter how big or small the moments are, I hope we continue creating beautiful memories together, sharing smiles, supporting each other, and making ordinary days feel special.

Today, I just want you to feel loved, appreciated, and celebrated.

Happy Birthday, Chellam ♥️

You are my favorite person, my sweetest thought, and a very special part of my world. ❤️`,
  cakeInstructions: "Close your eyes, make a wish, and tap the candles, birthday girl! 💗",
  cakeDone: "Yayyy, Chellam! May your sweetest wishes come true! ♥️",
  reasons: [
    ["smile",  "Your smile makes everything feel brighter. 😊"],
    ["flower", "You make ordinary moments feel special. 🌷"],
    ["heart",  "Your happiness means so much to me. 💗"],
    ["butter", "You have a beautiful way of making my heart smile. 🦋"],
    ["star",   "You deserve every wonderful thing life has to offer. ✨"],
    ["bow",    "And, of course, you will always be my Chellam. ♥️"]
  ],
  letterHeading: "One Last Little Surprise for You, Chellam 💌",
  letter:
`My dearest Chellam, Rashmika ♥️

If you have reached this little letter, I want you to know that every part of this surprise was created with one simple wish: to make you smile on your special day.

Words can never perfectly explain how much a person can mean to us, but I hope these little words make you feel a little of the love and happiness you bring into my world.

On your birthday, I wish you countless reasons to smile, courage for every challenge, peace in every difficult moment, and beautiful opportunities to follow your dreams.

I hope you always remember how valuable you are, how much you deserve to be loved, and how beautifully unique you are.

Whatever the future brings, I hope we keep collecting moments that make us laugh, memories that make us smile, and reasons to be grateful for one another.

Today is your day, my Chellam. Keep smiling, keep shining, and never forget how special you are.

Happy Birthday, Rashmika. ♥️

With all my love,
Your person, forever cheering for you. ❤️`,
  madeWith: "Made with love, especially for Rashmika ♥️",
  finalLine: "That's the whole little world. Want to wander through it again?"
};
/* ==================== END OF CONFIG ==================== */

const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- fill text from CONFIG ---------- */
$("wTitle").textContent = CONFIG.welcomeTitle;
$("wSub").textContent = CONFIG.welcomeSub;
$("openBtn").textContent = CONFIG.openButton;
$("bTitle").textContent = CONFIG.birthdayTitle;
$("bNick").textContent = CONFIG.birthdayNick;
$("bSub").textContent = CONFIG.birthdaySub;
$("bDate").textContent = CONFIG.birthdayDate; $("bDate").hidden = !CONFIG.birthdayDate;
$("cakeInstr").textContent = CONFIG.cakeInstructions;
$("lHead").textContent = CONFIG.letterHeading;
$("madeWith").textContent = CONFIG.madeWith;
$("finalLine").textContent = CONFIG.finalLine;

/* ---------- floating hearts / stars / petals ---------- */
(function(){
  const box = $("float"), icons = ["♥","✦","❀","♡","✧","❁"], cols = ["#ffb6d0","#d9c8f5","#ffd3b8","#ff9ec4","#fff"];
  const n = innerWidth < 600 ? 14 : 24;
  for(let i=0;i<n;i++){
    const s = document.createElement("span");
    s.textContent = icons[i % icons.length];
    s.style.left = Math.random()*100 + "%";
    s.style.fontSize = (12 + Math.random()*22) + "px";
    s.style.color = cols[i % cols.length];
    s.style.animationDuration = (11 + Math.random()*14) + "s";
    s.style.animationDelay = (-Math.random()*20) + "s";
    box.appendChild(s);
  }
})();

/* ---------- confetti (canvas, lightweight) ---------- */
const cv = $("confetti"), cx = cv.getContext("2d"); let parts = [], raf = 0;
function sizeCv(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", sizeCv); sizeCv();
function confetti(count = 130){
  if(reduced) return;
  const colors = ["#ff7aa8","#ffb6d0","#d9c8f5","#ffd36b","#8ec5ff","#fff","#ffd3b8"];
  for(let i=0;i<count;i++) parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,w:6+Math.random()*7,h:4+Math.random()*6,
    vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:colors[i%colors.length]});
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
  parts = parts.filter(p=>p.y < cv.height+20);
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if(!parts.length) cx.clearRect(0,0,cv.width,cv.height);
}

/* ---------- sparkle burst ---------- */
function sparkles(x, y, n = 16){
  if(reduced) return;
  const ic = ["✦","♥","✧","✨","♡"];
  for(let i=0;i<n;i++){
    const s = document.createElement("span"); s.className = "sparkle"; s.textContent = ic[i % ic.length];
    const a = Math.random()*6.28, d = 50 + Math.random()*110;
    s.style.left = x+"px"; s.style.top = y+"px"; s.style.fontSize = (12+Math.random()*16)+"px";
    s.style.setProperty("--x", Math.cos(a)*d+"px"); s.style.setProperty("--y", Math.sin(a)*d+"px");
    s.style.color = ["#ffb347","#ff7aa8","#c9a7f5"][i%3];
    document.body.appendChild(s); setTimeout(()=>s.remove(), 1200);
  }
}
const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; };

/* ---------- typewriter ---------- */
const timers = new Map();
function typeText(el, text, speed = 28, done){
  clearTimeout(timers.get(el)); el.textContent = "";
  if(reduced){ el.textContent = text; done && done(); return; }
  el.classList.add("cursor"); let i = 0;
  (function step(){
    el.textContent = text.slice(0, ++i);
    if(i < text.length){ timers.set(el, setTimeout(step, /[.!?\n]/.test(text[i-1]) ? speed*6 : speed)); }
    else { el.classList.remove("cursor"); done && done(); }
  })();
}
function stopType(el){ clearTimeout(timers.get(el)); el.classList.remove("cursor"); }

/* ---------- music (optional, only after a tap) ---------- */
let audio = null, musicOK = true;
const musicBtn = $("music");
function showNote(t){ const n = $("musicNote"); n.textContent = t; n.style.display = "block"; setTimeout(()=>n.style.display = "none", 4500); }
function setMusicUI(on){
  musicBtn.classList.toggle("playing", on); musicBtn.setAttribute("aria-pressed", on);
  musicBtn.setAttribute("aria-label", on ? "Pause music" : "Play music"); $("musicLbl").textContent = on ? "Pause" : "Play";
}
function initAudio(){
  if(audio) return;
  try{
    audio = new Audio(CONFIG.musicPath); audio.loop = true; audio.volume = .6; audio.preload = "auto";
    audio.addEventListener("error", ()=>{ musicOK = false; setMusicUI(false); showNote("Music file not found — the surprise works without it 💗"); });
  }catch(e){ musicOK = false; }
}
function playMusic(){
  initAudio(); if(!audio || !musicOK) return;
  const p = audio.play();
  if(p && p.then) p.then(()=>setMusicUI(true)).catch(()=>{ setMusicUI(false); if(musicOK) showNote("Tap the music button to start the song 🎵"); });
}
musicBtn.addEventListener("click", ()=>{
  initAudio();
  if(!musicOK){ showNote("Add romantic-music.mp3 next to index.html to enable music 🎵"); return; }
  if(audio.paused) playMusic(); else { audio.pause(); setMusicUI(false); }
});

/* ---------- opening ---------- */
$("openBtn").addEventListener("click", e=>{
  const btn = e.currentTarget; btn.disabled = true;
  $("gift").classList.add("open");
  const [x,y] = center($("gift")); sparkles(x,y,24); confetti(80);
  playMusic(); musicBtn.classList.add("show");
  setTimeout(()=>{
    $("welcome").classList.add("gone");
    $("main").classList.add("show"); document.body.classList.remove("locked");
    scrollTo({top:0,behavior:"auto"}); observeReasons();
    setTimeout(()=>{ $("welcome").style.display = "none"; }, 800);
  }, reduced ? 50 : 1300);
});

/* ---------- wish ---------- */
$("wishBtn").addEventListener("click", e=>{
  const [x,y] = center(e.currentTarget); sparkles(x,y,28); confetti(60);
  typeText($("wishMsg"), CONFIG.wishText, 30);
});

/* ---------- heartfelt message ---------- */
$("readBtn").addEventListener("click", e=>{
  const [x,y] = center(e.currentTarget); sparkles(x,y,14);
  e.currentTarget.textContent = "Read It Again 💌";
  typeText($("msgText"), CONFIG.message, 22);
});

/* ---------- cake ---------- */
const candleColors = ["#ff7aa8","#8ec5ff","#ffd36b","#b49cf0","#8ee0b0"];
const candlePos = [20,35,50,65,80]; let out = 0;
(function buildCandles(){
  const wrap = $("cakeWrap");
  candlePos.forEach((p,i)=>{
    const b = document.createElement("button"); b.type = "button"; b.className = "candle";
    b.style.left = p+"%"; b.style.setProperty("--c", candleColors[i]);
    b.setAttribute("aria-label", "Blow out candle " + (i+1) + " of 5");
    b.innerHTML = '<span class="smoke"></span><span class="flame"></span><span class="stick"></span>';
    b.addEventListener("click", ()=>blow(b));
    wrap.appendChild(b);
  });
  updateCount();
})();
function updateCount(){ $("cakeCount").textContent = out < 5 ? (5 - out) + " candle" + (5-out===1?"":"s") + " still glowing" : ""; }
function blow(b){
  if(b.classList.contains("out")) return;
  b.classList.add("out"); b.setAttribute("aria-label","Candle blown out"); out++; updateCount();
  const [x,y] = center(b); sparkles(x,y-30,5);
  if(out === 5){
    confetti(180); $("cakeMsg").textContent = CONFIG.cakeDone;
    const [cx2,cy2] = center($("cakeWrap")); sparkles(cx2,cy2,30);
  }
}
$("relight").addEventListener("click", ()=>{
  out = 0; $("cakeMsg").textContent = "";
  document.querySelectorAll(".candle").forEach((c,i)=>{ c.classList.remove("out"); c.setAttribute("aria-label","Blow out candle "+(i+1)+" of 5"); });
  updateCount();
});

/* ---------- reasons ---------- */
const art = {
  smile:'<circle cx="32" cy="32" r="26" fill="#ffd36b"/><circle cx="23" cy="26" r="3.5" fill="#6a3550"/><circle cx="41" cy="26" r="3.5" fill="#6a3550"/><path d="M20 38q12 14 24 0" stroke="#6a3550" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="17" cy="36" r="4" fill="#ff9ec4" opacity=".7"/><circle cx="47" cy="36" r="4" fill="#ff9ec4" opacity=".7"/>',
  flower:'<g fill="#ff9ec4"><circle cx="32" cy="14" r="10"/><circle cx="50" cy="28" r="10"/><circle cx="43" cy="49" r="10"/><circle cx="21" cy="49" r="10"/><circle cx="14" cy="28" r="10"/></g><circle cx="32" cy="34" r="9" fill="#ffd36b"/>',
  heart:'<path d="M32 56C10 38 6 28 6 20a13 13 0 0 1 26-3 13 13 0 0 1 26 3c0 8-4 18-26 36z" fill="#ff7aa8"/><path d="M16 18q3-6 9-5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>',
  butter:'<path d="M32 32C18 8 4 14 8 30s16 12 24 2zM32 32c14-24 28-18 24-2s-16 12-24 2z" fill="#c9a7f5"/><path d="M32 34c-14 4-18 22-8 24s8-12 8-24zM32 34c14 4 18 22 8 24s-8-12-8-24z" fill="#ffb6d0"/><rect x="30" y="20" width="4" height="30" rx="2" fill="#6a3550"/>',
  star:'<path d="M32 4l7 17 18 2-14 12 5 18-16-10-16 10 5-18L7 23l18-2z" fill="#ffd36b"/><circle cx="52" cy="10" r="3" fill="#ffb6d0"/><circle cx="10" cy="52" r="3" fill="#d9c8f5"/>',
  bow:'<path d="M32 32L6 16v32zM32 32l26-16v32z" fill="#ff9ec4"/><circle cx="32" cy="32" r="8" fill="#e0568f"/><path d="M28 40l-8 18M36 40l8 18" stroke="#e0568f" stroke-width="5" stroke-linecap="round"/>'
};
CONFIG.reasons.forEach(([k,t])=>{
  const d = document.createElement("div"); d.className = "card reason"; d.tabIndex = 0;
  d.innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true">'+(art[k]||art.heart)+'</svg><p></p>';
  d.querySelector("p").textContent = t;
  const pop = ev=>{ d.classList.remove("pop"); void d.offsetWidth; d.classList.add("pop"); const [x,y]=center(d); sparkles(x,y,8); };
  d.addEventListener("click", pop);
  d.addEventListener("keydown", ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); pop(); } });
  $("grid").appendChild(d);
});
let io;
function observeReasons(){
  const cards = document.querySelectorAll(".reason");
  if(!("IntersectionObserver" in window)){ cards.forEach(c=>c.classList.add("in")); return; }
  io && io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting){ const i=[...cards].indexOf(en.target); setTimeout(()=>en.target.classList.add("in"), (i%3)*140); io.unobserve(en.target); }
  }), {threshold:.25});
  cards.forEach(c=>{ c.classList.remove("in"); io.observe(c); });
}

/* ---------- love letter ---------- */
$("letterBtn").addEventListener("click", e=>{
  const btn = e.currentTarget; btn.hidden = true;
  const env = $("env"); env.classList.add("open");
  const [x,y] = center(env); sparkles(x,y,22); confetti(40);
  setTimeout(()=>{
    env.classList.add("gone"); $("letterBox").classList.add("show");
    $("letterBox").scrollIntoView({behavior: reduced ? "auto" : "smooth", block:"center"});
    typeText($("letterText"), CONFIG.letter, 24, ()=>{ const [a,b]=center($("letterText")); sparkles(a,b,20); });
  }, reduced ? 50 : 1000);
});

/* ---------- replay ---------- */
$("replayBtn").addEventListener("click", ()=>{
  stopType($("msgText")); stopType($("letterText")); stopType($("wishMsg"));
  $("msgText").textContent = ""; $("letterText").textContent = ""; $("wishMsg").textContent = "";
  $("readBtn").textContent = "Read My Heart 💌";
  $("relight").click();
  $("env").classList.remove("open","gone"); $("letterBox").classList.remove("show"); $("letterBtn").hidden = false;
  $("gift").classList.remove("open"); $("openBtn").disabled = false;
  $("main").classList.remove("show"); document.body.classList.add("locked");
  const w = $("welcome"); w.style.display = ""; void w.offsetWidth; w.classList.remove("gone");
  scrollTo({top:0,behavior:"auto"});
  if(audio){ audio.pause(); audio.currentTime = 0; setMusicUI(false); }
  musicBtn.classList.remove("show");
});
</script>
